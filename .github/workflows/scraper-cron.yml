name: Automated Content Scraper (Chunked)

on:
  schedule:
    # Berjalan setiap 15 menit agar chunking terus berlanjut sepanjang hari
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scraper API Chunk
        run: |
          # Ambil base URL, hilangkan https:// dan trailing slash jika ada
          CLEAN_URL=$(echo "${{ secrets.SITE_URL }}" | sed -e 's|^https://||' -e 's|/$||')
          
          echo "Triggering scraper chunk at https://$CLEAN_URL/api/scraper/run"
          
          # Gunakan GET untuk memicu 1 chunk per pemanggilan.
          # Sistem akan membaca state terakhir dari database secara otomatis.
          curl -s -f "https://$CLEAN_URL/api/scraper/run?secret=${{ secrets.SCRAPER_SECRET }}&task=scrape"

