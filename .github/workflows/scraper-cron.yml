name: Automated Content Scraper

on:
  schedule:
    # Berjalan setiap hari jam 02:00 AM WIB (19:00 UTC)
    - cron: "0 19 * * *"
  workflow_dispatch:
    # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scraper API
        run: |
          # Clean URL (remove https:// or trailing slash if present)
          CLEAN_URL=$(echo "${{ secrets.SITE_URL }}" | sed -e 's|^https://||' -e 's|/$||')
          
          echo "Triggering scraper at https://$CLEAN_URL/api/scraper/run"
          
          # Trigger API using GET with URL-encoded secret
          # -s: silent
          # -f: fail on 4xx/5xx
          # -G: use GET (params in data-urlencode will be appended to URL)
          curl -s -f -G \
            --data-urlencode "secret=${{ secrets.SCRAPER_SECRET }}" \
            "https://$CLEAN_URL/api/scraper/run"
