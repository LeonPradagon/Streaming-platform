name: Automated Content Scraper

on:
  schedule:
    # Berjalan setiap hari jam 02:00 AM WIB (19:00 UTC)
    - cron: "0 19 * * *"
  workflow_dispatch:
    # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scraper API
        run: |
          # Menggunakan -f agar build GitHub gagal jika website membalas dengan error (401/403/500)
          # Menggunakan -s untuk menyembunyikan progress bar yang tidak perlu
          curl -s -f -X GET "https://${{ secrets.SITE_URL }}/api/scraper/run?secret=${{ secrets.SCRAPER_SECRET }}"
