name: Automated Content Scraper (Chunked)

on:
  schedule:
    # Berjalan setiap 15 menit agar chunking terus berlanjut sepanjang hari
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: netix-scheduled-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scraper API Chunk
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$SCRAPER_SECRET" ]; then
            echo "SITE_URL and SCRAPER_SECRET repository secrets are required" >&2
            exit 1
          fi
          BASE_URL="${SITE_URL%/}"
          curl --silent --show-error --fail --max-time 240 --retry 2 \
            --header "Authorization: Bearer $SCRAPER_SECRET" \
            "$BASE_URL/api/cron/scraper"
